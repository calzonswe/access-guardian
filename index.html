<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Rollbaserat åtkomstkontrollsystem (RBAC) för hantering av tillträdesansökningar till anläggningar och områden." />

    <meta property="og:title" content="Access Guardian — Tillträdessystem" />
    <meta property="og:description" content="Rollbaserat åtkomstkontrollsystem (RBAC) för hantering av tillträdesansökningar till anläggningar och områden." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors ThemeContext.
      (function () {
        try {
          var p = localStorage.getItem('rbac-theme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
